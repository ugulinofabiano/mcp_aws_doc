name: UX pass (Playwright)

on:
  workflow_dispatch: {}
  pull_request:
    branches: [ main ]

jobs:
  ux-pass:
    name: Playwright UX pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps

      - name: Build site
        working-directory: web
        run: npm run build --if-present

      - name: Copy example data into dist
        working-directory: web
        run: cp data.example.json dist/data.example.json

      - name: Serve built site (background)
        working-directory: web
        run: |
          npx serve dist -l 5173 &
          echo "Waiting for server to come up..."
          for i in {1..30}; do
            if curl -sSfL http://localhost:5173/ >/dev/null; then
              echo "Server ready"
              break
            fi
            echo "Waiting... ($i)"
            sleep 1
          done

      - name: Run UX pass
        working-directory: web
        env:
          SKIP_SERVER: '1'
          BASE_URL: 'http://localhost:5173/'
        run: node scripts/ux_pass.js

      - name: Upload UX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ux-pass-artifacts
          path: |
            web/ux_pass.png
            web/ux_fail.html
